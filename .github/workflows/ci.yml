# CI/CD：每次 PR / 推送到 main 都会
#   1. test   ：装依赖、跑单元测试（离线模式，不需要任何 API key）
#   2. docker ：构建镜像，用 docker compose 起 api + redis 整套服务做冒烟测试
#   3. 只在推送到 main 时：把镜像发布到 GitHub 容器仓库 ghcr.io/<owner>/fishing-agent
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OFFLINE: "1"            # 强制离线：LLM 节点走规则 / 模板，CI 不调用任何外部模型
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

  docker:
    name: Docker build & smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write         # 推送镜像到 ghcr.io 需要
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fishing-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start api + redis with docker compose
        run: docker compose up -d --wait --wait-timeout 240

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health | tee health.json
          python3 - <<'EOF'
          import json
          d = json.load(open("health.json"))
          assert d["ok"] and d["kb_index"], d
          assert d["checkpointer"] == "redis", d
          print("health OK:", d)
          EOF
          TOKEN=$(curl -fsS -X POST "http://localhost:8000/v1/dev-token?user_id=ci" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fsSN -X POST http://localhost:8000/chat \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"thread_id":"ci","text":"明天 Annapolis 几点钓鱼比较好？"}' | tee chat.txt
          grep -q "event: done" chat.txt

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Push image to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
